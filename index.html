<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCFSC Before and After Photo Viewer</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<style>
:root{--bg:#e9eef2;--panel:#fff;--ink:#16212b;--mute:#5a6b78;--line:#cfd8df;--before:#7935aa;--after:#2f855a;--stage:#0e1418}
@media (prefers-color-scheme:dark){:root{--bg:#10171c;--panel:#182129;--ink:#e6edf2;--mute:#93a4b1;--line:#2a3640;--before:#b57be8;--after:#62c48c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column}
#app{display:grid;grid-template-columns:minmax(260px,30%) 1fr;flex:1 1 auto;min-height:0}
#map{height:100%;min-height:0}
aside{background:var(--panel);border-left:1px solid var(--line);padding:6px 12px 10px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.banner{flex:none;display:flex;align-items:center;gap:16px;min-height:72px;padding:6px 20px;background:#67a06d;border-bottom:1px solid #8c5f55;color:#fff}
.banner img{height:60px;width:auto;display:block}
.banner h1{margin:0;font-size:clamp(19px,2.6vw,30px);font-weight:400;line-height:1.15}
.head.row{flex-wrap:nowrap;gap:12px;align-items:center;justify-content:space-between}
.head button{flex:none;white-space:nowrap}
#hint{flex:1;min-width:0;margin:0;color:var(--mute);font-size:12px;line-height:1.3}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:4px;padding:4px 8px;display:flex;flex-direction:column;gap:1px}
.slot.before{--c:var(--before)}.slot.after{--c:var(--after)}
.slot strong{color:var(--c);font-size:13px}
.slot .meta{color:var(--mute);font-size:12px}
.fields{margin:2px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);column-gap:8px;font-size:12px;line-height:1.35}
.fields dt:nth-of-type(even){padding-left:12px}
.fields:empty{display:none}
.fields dt{color:var(--mute);white-space:nowrap}
.fields dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:22px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row button{font:inherit;font-size:12px;padding:1px 7px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;cursor:pointer}
.row button:hover{border-color:var(--c,var(--mute))}
.row button:focus-visible,#rng:focus-visible+.knob{outline:2px solid var(--c,#2b6cb0);outline-offset:2px}
.cmp{--v:66%;position:relative;flex:1 1 auto;min-height:320px;background:var(--stage);border-radius:4px;overflow:hidden;user-select:none;-webkit-user-select:none}
.layer{position:absolute;inset:0}
#layer-before{clip-path:inset(0 calc(100% - var(--v)) 0 0)}
.layer img{width:100%;height:100%;object-fit:contain;display:block}
.cmp.fill .layer img{object-fit:cover}
.empty{position:absolute;top:50%;transform:translateY(-50%);max-width:44%;color:#8fa1ad;font-size:13px;padding:0 14px}
.empty.left{left:0}.empty.right{right:0;text-align:right}
.bar{position:absolute;top:0;bottom:0;left:var(--v);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none}
.knob{position:absolute;top:50%;left:var(--v);width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;color:#16212b;display:grid;place-items:center;font-size:16px;box-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none}
.tag{position:absolute;top:8px;padding:2px 9px;font-size:12px;border-radius:3px;color:#fff;pointer-events:none}
.tag.b{left:8px;background:#7935aa}.tag.a{right:8px;background:#2f855a}
#rng{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.esri-view .esri-view-surface:focus::after{outline:none}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:44% 56%}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>

  <h1 id="app-title">BCFSC Before and After Photo Viewer</h1>
</header>
<div id="app">
  <div id="map"></div>
  <aside>
    <div class="head row"><p id="hint">Loading map…</p><button id="fit" type="button">Fill frame</button></div>
    <div class="slots">
      <div class="slot before">
        <div class="top"><strong>Before</strong><div class="row">
          <button id="prev-before" data-side="before" data-act="prev" hidden aria-label="Previous before photo">‹</button>
          <button id="next-before" data-side="before" data-act="next" hidden aria-label="Next before photo">›</button>
          <button id="clear-before" data-side="before" data-act="clear" hidden>Clear</button>
        </div></div>
        <div class="meta" id="meta-before">None selected</div>
        <dl class="fields" id="fields-before"></dl>
      </div>
      <div class="slot after">
        <div class="top"><strong>After</strong><div class="row">
          <button id="prev-after" data-side="after" data-act="prev" hidden aria-label="Previous after photo">‹</button>
          <button id="next-after" data-side="after" data-act="next" hidden aria-label="Next after photo">›</button>
          <button id="clear-after" data-side="after" data-act="clear" hidden>Clear</button>
        </div></div>
        <div class="meta" id="meta-after">None selected</div>
        <dl class="fields" id="fields-after"></dl>
      </div>
    </div>
    <div class="cmp" id="cmp">
      <div class="layer"><img id="img-after" alt="After photo" hidden><div class="empty right" id="empty-after"></div></div>
      <div class="layer" id="layer-before"><img id="img-before" alt="Before photo" hidden><div class="empty left" id="empty-before"></div></div>
      <div class="bar"></div>
      <span class="tag b" id="tag-before">Before</span><span class="tag a" id="tag-after">After</span>
      <input type="range" id="rng" min="0" max="100" value="66" aria-label="Slide between the before and after photo">
      <div class="knob" aria-hidden="true">↔</div>
    </div>
  </aside>
</div>

<script src="https://js.arcgis.com/4.30/"></script>
<script>
/* ---- Edit these to match your web map ---- */
const CONFIG = {
  appTitle: "BCFSC Before and After Photo Viewer", // text shown in the header bar
  logoUrl: "",                         // optional: replace the built-in logo with a file saved next to this page or a full web address
  webMapId: "1171c16791d6491c9af1606f33572b7f",
  beforeLayerTitle: "Before Photos",   // exact layer title in the web map
  afterLayerTitle: "After Photos",     // exact layer title in the web map
  dateField: "date_photos_were_taken", // field holding the photo date
  dateLabel: "Date photo was taken",   // label shown for the date in the cards
  // Shown in each card. Use a plain name/alias, or { label, field } to show a custom label for an exact field name. The date is added automatically.
  cardFields: ["Grant Number", { label: "Project", field: "project_name" }, "Surveyor"],
  selectRadiusFeet: 500,               // clicking one point also selects the nearest point of the other type within this distance
  showPopup: true,                     // set to false to turn the map popup off (handy when troubleshooting)
  portalUrl: "https://bcfsc.maps.arcgis.com/",
  oauthClientId: "JeIhbRweZDuECJ99"   // Client ID of your ArcGIS OAuth credentials. When set, sign-in uses the standard Esri sign-in page; when empty, the built-in sign-in box is used
};

require(["esri/config", "esri/WebMap", "esri/views/MapView", "esri/widgets/Home", "esri/identity/OAuthInfo", "esri/identity/IdentityManager",
         "esri/geometry/geometryEngine", "esri/geometry/Polyline",
         "esri/widgets/Legend", "esri/widgets/LayerList", "esri/widgets/Expand"],
function (esriConfig, WebMap, MapView, Home, OAuthInfo, IdentityManager, geometryEngine, Polyline, Legend, LayerList, Expand) {
  const $ = (id) => document.getElementById(id);
  esriConfig.portalUrl = CONFIG.portalUrl;

  $("app-title").textContent = CONFIG.appTitle;
  document.title = CONFIG.appTitle;
  if (CONFIG.logoUrl) {
    const logo = $("logo"), builtIn = logo.src;
    logo.onerror = () => { logo.onerror = null; logo.src = builtIn; };   // fall back to the built-in logo if the file isn't found
    logo.src = CONFIG.logoUrl;
  }

  if (CONFIG.oauthClientId) {
    // Send people to the regular Esri sign-in page (so saved logins and single sign-on work), then back here.
    IdentityManager.registerOAuthInfos([new OAuthInfo({ appId: CONFIG.oauthClientId, portalUrl: CONFIG.portalUrl, popup: false })]);
    try {
      const saved = sessionStorage.getItem("slider-credentials");
      if (saved) IdentityManager.initialize(JSON.parse(saved));
    } catch (e) { /* ignore a bad saved session */ }
    IdentityManager.on("credential-create", () => {
      try { sessionStorage.setItem("slider-credentials", JSON.stringify(IdentityManager.toJSON())); } catch (e) { /* storage unavailable */ }
    });
  } else {
    console.info("No oauthClientId set in CONFIG, so the built-in sign-in box will be used.");
  }

  const sides = {
    before: { layer: null, graphic: null, photos: [], i: 0, loading: false, hl: null, token: 0 },
    after:  { layer: null, graphic: null, photos: [], i: 0, loading: false, hl: null, token: 0 }
  };
  let clickSeq = 0;        // bumped on every map click; lets a newer click cancel an older lookup
  let popupSide = null;    // which side the open popup belongs to

  const webmap = new WebMap({ portalItem: { id: CONFIG.webMapId } });
  const view = new MapView({ container: "map", map: webmap, popupEnabled: false });
  view.ui.add(new Home({ view }), "top-left");

  // Layers and legend tools: collapsed buttons at the top right of the map, one open at a time.
  view.ui.add(new Expand({ view, content: new LayerList({ view }), expandIcon: "layers", expandTooltip: "Layers", group: "tools" }), "top-right");
  view.ui.add(new Expand({ view, content: new Legend({ view }), expandIcon: "legend", expandTooltip: "Legend", group: "tools" }), "top-right");
  view.popup.dockEnabled = true;
  view.popup.dockOptions = { buttonEnabled: false, breakpoint: false, position: "bottom-center" };  // always docked at the bottom of the map
  view.popup.highlightEnabled = false;                                   // the app draws its own highlights

  view.when(() => {
    const find = (t) => webmap.allLayers.find((l) => l.title === t);
    sides.before.layer = find(CONFIG.beforeLayerTitle);
    sides.after.layer = find(CONFIG.afterLayerTitle);
    if (!sides.before.layer || !sides.after.layer) {
      const titles = webmap.allLayers.map((l) => `"${l.title}"`).toArray().join(", ");
      $("hint").textContent = `Couldn't find the layers "${CONFIG.beforeLayerTitle}" and "${CONFIG.afterLayerTitle}". Layers in this map: ${titles}. Update CONFIG at the top of the script.`;
      return;
    }
    setStatus(idleHint());
    view.on("click", onMapClick);
    render();
  }, (err) => {
    $("hint").textContent = "The web map didn't load. Check the web map ID and that you can access it. " + (err && err.message ? err.message : "");
  });

  async function onMapClick(evt) {
    const seq = ++clickSeq;
    let hit;
    try {
      hit = await view.hitTest(evt, { include: [sides.before.layer, sides.after.layer] });
    } catch (e) {
      console.warn("hitTest failed", e);
      setStatus("Couldn't read what was clicked: " + (e && e.message ? e.message : e));
      return;
    }
    if (seq !== clickSeq) return;                      // a newer click or a Clear superseded this one
    const r = hit.results.find((x) => x.graphic);
    if (!r) { clearAll(); setStatus(idleHint()); return; }   // clicked away from any feature
    const lyr = r.layer || r.graphic.layer;
    const key = lyr === sides.before.layer ? "before" : "after";
    setStatus(`Selected ${aOrAn(key)} point (ID ${r.graphic.attributes[sides[key].layer.objectIdField]}). Looking for ${aOrAn(key === "before" ? "after" : "before")} point within ${CONFIG.selectRadiusFeet} ft…`);
    setPoint(key, r.graphic).catch((e) => console.warn("Select failed", e));
    autoPair(key, r.graphic, seq).catch((e) => console.warn("Auto-select failed", e));
  }

  const aOrAn = (w) => (w === "after" ? "an " : "a ") + w;     // "a before", "an after"
  const idleHint = () => `Click a before or after point. The nearest point of the other type within ${CONFIG.selectRadiusFeet} ft is selected automatically. Click away from any point to clear both.`;
  const setStatus = (msg) => { $("hint").textContent = msg; };

  function clearAll() {
    clearSide("before");
    clearSide("after");
    view.popup.close();
  }

  // Case-insensitive field lookup, so a casing difference in CONFIG doesn't hide the value.
  function readField(attrs, name) {
    if (!attrs) return undefined;
    const k = Object.keys(attrs).find((x) => x.toLowerCase() === name.toLowerCase());
    return k ? attrs[k] : undefined;
  }

  function formatDate(v) {
    if (v === null || v === undefined || v === "") return "Date unknown";
    let d;
    if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v)) {      // date-only value: avoid the UTC day shift
      const [y, m, day] = v.split("-").map(Number);
      d = new Date(y, m - 1, day);
    } else {
      d = new Date(v);
    }
    return isNaN(d) ? String(v) : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  const norm = (t) => String(t || "").toLowerCase().replace(/[^a-z0-9]/g, "");

  // Match the wanted fields to real fields on the layer, by name or alias (ignoring case, spaces and underscores).
  function resolveCols(layer) {
    const fields = layer.fields || [];
    const find = (w) => fields.find((f) => norm(f.name) === norm(w)) || fields.find((f) => norm(f.alias) === norm(w)) || null;
    const cols = CONFIG.cardFields.map((item) => {
      const label = typeof item === "string" ? item : item.label;
      const f = find(typeof item === "string" ? item : item.field);
      return { label, name: f ? f.name : null, field: f };
    });
    const df = find(CONFIG.dateField);
    cols.push({ label: CONFIG.dateLabel, name: df ? df.name : CONFIG.dateField, field: df, isDate: true });
    const missing = cols.filter((c) => !c.field).map((c) => c.label);
    if (missing.length) {
      console.warn(`Fields not found on "${layer.title}": ${missing.join(", ")}. Available: ` + fields.map((f) => `${f.name} (${f.alias})`).join(", "));
    }
    return cols;
  }

  function displayValue(col, attrs) {
    const v = col.name ? readField(attrs, col.name) : undefined;
    if (v === null || v === undefined || v === "") return "\u2014";
    if (col.isDate) return formatDate(v);
    const dom = col.field && col.field.domain;
    if (dom && dom.type === "coded-value") {
      const c = dom.codedValues.find((x) => x.code === v);
      if (c) return c.name;
    }
    return String(v);
  }

  // Show the layer's popup exactly as configured in the web map (field list, order, formatting).
  function openPopup(s, graphic) {
    if (!CONFIG.showPopup) return;
    try {
      openPopupUnsafe(s, graphic);
    } catch (e) {
      console.warn("Popup failed", e);
    }
  }

  function openPopupUnsafe(s, graphic) {
    const tpl = s.layer.popupTemplate;
    if (!tpl) console.warn(`No popup is configured for "${s.layer.title}" in the web map, so a default popup (fields in service order) is shown.`);
    graphic.popupTemplate = tpl || s.layer.createPopupTemplate();
    view.popup.open({ features: [graphic], location: graphic.geometry });
  }

  function feetBetween(a, b) {
    try {
      const line = new Polyline({ paths: [[[a.x, a.y], [b.x, b.y]]], spatialReference: a.spatialReference });
      return geometryEngine.geodesicLength(line, "feet");
    } catch (e) {
      return geometryEngine.distance(a, b, "feet");
    }
  }

  // Circle of the selection radius around a point, measured on the ground.
  function searchArea(pt) {
    const r = CONFIG.selectRadiusFeet;
    try { return geometryEngine.geodesicBuffer(pt, r, "feet"); } catch (e) { /* try the planar version */ }
    try { return geometryEngine.buffer(pt, r, "feet"); } catch (e) { return null; }
  }

  // Nearest feature of `layer` within the selection radius of `from`.
  // Asks the service first, then falls back to the features already loaded in the map.
  async function findNearest(from, layer) {
    const R = CONFIG.selectRadiusFeet;
    const area = searchArea(from.geometry);
    // createQuery() carries the layer's own filter (definitionExpression), so only this layer's photo type is searched.
    const q = layer.createQuery();
    q.spatialRelationship = "intersects";
    q.returnGeometry = true;
    q.outFields = [layer.objectIdField];
    q.outSpatialReference = view.spatialReference;
    if (area) q.geometry = area;
    else { q.geometry = from.geometry; q.distance = R * 1.6; q.units = "feet"; }   // wide net; filtered precisely below

    let feats = [], failed = false;
    try {
      feats = (await layer.queryFeatures(q)).features;
    } catch (e) {
      console.warn(`Service search failed for "${layer.title}"`, e);
      failed = true;
    }
    if (!feats.length) {
      try {
        const lv = await view.whenLayerView(layer);
        feats = (await lv.queryFeatures(q)).features;
        failed = false;
      } catch (e) {
        console.warn(`Map search failed for "${layer.title}"`, e);
      }
    }
    let best = null;
    for (const f of feats) {
      if (!f.geometry) continue;
      const ft = feetBetween(from.geometry, f.geometry);
      if (ft <= R && (!best || ft < best.feet)) best = { graphic: f, feet: ft };
    }
    if (!layer.definitionExpression) console.warn(`"${layer.title}" has no filter (definition expression) in the web map, so a search of it can return the wrong photo type.`);
    return { best, failed: failed && !best, unfiltered: !layer.definitionExpression };
  }

  async function autoPair(key, graphic, seq) {
    const other = key === "before" ? "after" : "before";
    const s = sides[key], o = sides[other];
    const tok = s.token;                               // the clicked side must stay as it is while we search
    const R = CONFIG.selectRadiusFeet;
    // Clicking a before point always re-pairs. Clicking an after point only fills in the before side when it is
    // empty or too far away, so you can step through several afters for the same before.
    if (key === "after" && o.graphic && o.graphic.geometry && feetBetween(o.graphic.geometry, graphic.geometry) <= R) {
      setStatus(`Selected an after point. The selected before point is within ${R} ft, so it was kept.`);
      return;
    }
    let best = null, failed = false, unfiltered = false;
    try {
      ({ best, failed, unfiltered } = await findNearest(graphic, o.layer));
    } catch (e) {
      console.warn("Nearby search error", e);
      failed = true;
    }
    if (seq !== clickSeq || s.token !== tok) return;   // the user clicked again or cleared meanwhile
    console.info(best ? `Auto-select: ${other} point ${Math.round(best.feet)} ft away` : `Auto-select: no ${other} point found within ${R} ft`);
    setStatus(best ? `Selected ${aOrAn(key)} point and the nearest ${other} point, ${Math.round(best.feet)} ft away.`
      : failed ? `Selected ${aOrAn(key)} point, but the search for a nearby ${other} point failed (see the console).`
      : `Selected ${aOrAn(key)} point. No ${other} point within ${R} ft.`);
    if (unfiltered) setStatus($("hint").textContent + ` Warning: the "${o.layer.title}" layer has no filter in this web map, so it may include the wrong photo type.`);
    if (best) {
      setPoint(other, best.graphic, { popup: false, note: `Auto-selected, ${Math.round(best.feet)} ft away` })
        .catch((e) => console.warn("Select failed", e));
    } else {
      clearSide(other);
      o.msg = failed ? "Couldn't search for nearby points (see the console)" : `No ${other} point within ${R} ft`;
      render();
    }
  }

  async function setPoint(key, graphic, opts = {}) {
    const s = sides[key];
    const tok = ++s.token;
    if (s.hl) { s.hl.remove(); s.hl = null; }
    s.graphic = graphic; s.photos = []; s.i = 0; s.loading = true; s.error = false; s.msg = ""; s.note = opts.note || "";
    s.attrs = graphic.attributes;
    if (!s.cols) s.cols = resolveCols(s.layer);

    if (opts.popup !== false) { openPopup(s, graphic); popupSide = key; }

    render();
    try {
      const lv = await view.whenLayerView(s.layer);
      if (s.token !== tok) return;
      s.hl = lv.highlight(graphic);
      const oid = graphic.attributes[s.layer.objectIdField];
      // Clicked graphics only carry the fields the map needs to draw/popup, so ask for the card fields explicitly.
      const [res, found] = await Promise.all([
        s.layer.queryAttachments({ objectIds: [oid] }),
        s.layer.queryFeatures({ objectIds: [oid], outFields: s.cols.filter((c) => c.name).map((c) => c.name), returnGeometry: false }).catch(() => null)
      ]);
      if (s.token !== tok) return;                     // this side was cleared or re-selected meanwhile
      if (found && found.features.length) s.attrs = Object.assign({}, graphic.attributes, found.features[0].attributes);
      s.photos = (res[oid] || []).filter((a) => (a.contentType || "").startsWith("image/"));
    } catch (e) {
      if (s.token !== tok) return;
      s.error = true;
    }
    s.loading = false;
    render();
  }

  // Fully reset one side: selection, highlight, photos, messages, and anything still loading for it.
  function clearSide(key) {
    const s = sides[key];
    s.token++;
    if (s.hl) { s.hl.remove(); s.hl = null; }
    Object.assign(s, { graphic: null, photos: [], i: 0, loading: false, error: false, attrs: null, note: "", msg: "" });
    if (popupSide === key) { view.popup.close(); popupSide = null; }
    render();
  }

  function render() {
    for (const k of ["before", "after"]) {
      const s = sides[k], img = $("img-" + k), empty = $("empty-" + k), meta = $("meta-" + k);
      const p = s.photos[s.i];
      const label = k === "before" ? "Before" : "After";
      const list = $("fields-" + k);
      let when = "";
      if (!s.graphic) {
        meta.textContent = "None selected"; meta.hidden = false;
        list.replaceChildren();
      } else {
        const dateCol = (s.cols || []).find((c) => c.isDate);
        const dv = dateCol ? readField(s.attrs, dateCol.name) : undefined;
        when = s.loading && dv == null ? "Loading date…" : formatDate(dv);
        meta.textContent = s.photos.length > 1 ? `Photo ${s.i + 1} of ${s.photos.length}` : "";
        meta.hidden = !meta.textContent;
        const nodes = [];
        for (const c of s.cols || []) {
          const dt = document.createElement("dt"), dd = document.createElement("dd");
          dt.textContent = c.label;
          const pending = s.loading && !(c.name && readField(s.attrs, c.name) != null);
          dd.textContent = pending ? "…" : displayValue(c, s.attrs);
          dd.title = dd.textContent;
          nodes.push(dt, dd);
        }
        list.replaceChildren(...nodes);
      }
      $("tag-" + k).textContent = s.graphic ? `${label}: ${when}` : label;
      if (p) {
        if (img.getAttribute("src") !== p.url) img.src = p.url;
        img.hidden = false; empty.hidden = true;
      } else {
        img.hidden = true; img.removeAttribute("src"); empty.hidden = false;
        empty.textContent = !s.graphic ? (s.msg || `Click ${aOrAn(k)} point on the map`)
          : s.loading ? "Loading photo…"
          : s.error ? "Couldn't load photos for this point"
          : "No photo attached to this point";
      }
      const multi = s.photos.length > 1;
      $("prev-" + k).hidden = !multi;
      $("next-" + k).hidden = !multi;
      $("clear-" + k).hidden = !s.graphic;
    }
  }

  document.querySelectorAll("button[data-act]").forEach((b) => b.addEventListener("click", () => {
    const s = sides[b.dataset.side], n = s.photos.length;
    if (b.dataset.act === "clear") return clearSide(b.dataset.side);
    if (!n) return;
    s.i = (s.i + (b.dataset.act === "next" ? 1 : n - 1)) % n;
    render();
  }));

  $("fit").addEventListener("click", (e) => {
    const fill = $("cmp").classList.toggle("fill");
    e.target.textContent = fill ? "Show full photos" : "Fill frame";
  });

  $("rng").addEventListener("input", (e) => $("cmp").style.setProperty("--v", e.target.value + "%"));
});
</script>
</body>
</html>
